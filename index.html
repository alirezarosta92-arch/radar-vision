
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR VISION</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111d;
  color:#e7f7ff;
  font-family:Tahoma,Arial;
  text-align:center;
  padding:18px;
}
h1{color:#00e5ff;letter-spacing:2px}
.panel{
  max-width:650px;
  margin:15px auto;
  padding:15px;
  background:#102337;
  border:1px solid #087e9c;
  border-radius:15px;
}
video{
  width:100%;
  max-width:600px;
  background:#000;
  border-radius:12px;
}
button,select{
  padding:12px;
  margin:6px;
  border:0;
  border-radius:8px;
  background:#00bcd4;
  color:#00121c;
  font-weight:bold;
  font-size:15px;
}
button:active{background:#80deea}
#status{color:#00e5ff}
#results{
  text-align:right;
  line-height:2;
  overflow-wrap:anywhere;
}
.item{
  background:#173c50;
  margin:7px 0;
  padding:10px;
  border-radius:8px;
}
small{color:#9bc8d8}
</style>
</head>

<body>

<h1>RADAR VISION</h1>
<p>سامانه آموزشی تشخیص اشیای معمولی</p>

<div class="panel">
  <video id="video" autoplay playsinline muted></video>
  <p id="status">در انتظار شروع...</p>

  <button id="startBtn">شروع دوربین</button>
  <button id="stopBtn">توقف</button>
  <button id="switchBtn">تغییر دوربین</button>
</div>

<div class="panel">
  <h3>تنظیمات تشخیص</h3>

  <select id="objectSelect">
    <option value="all">همه اشیای پشتیبانی‌شده</option>
    <option value="book">کتاب</option>
    <option value="cell phone">گوشی</option>
    <option value="bottle">بطری</option>
    <option value="cup">لیوان</option>
    <option value="laptop">لپ‌تاپ</option>
    <option value="mouse">ماوس</option>
    <option value="keyboard">کیبورد</option>
    <option value="chair">صندلی</option>
    <option value="backpack">کوله‌پشتی</option>
    <option value="clock">ساعت</option>
    <option value="remote">کنترل</option>
    <option value="banana">موز</option>
    <option value="apple">سیب</option>
    <option value="scissors">قیچی</option>
  </select>

  <p>
    <button id="beepBtn">تست صدای هشدار</button>
  </p>
</div>

<div class="panel">
  <h3>نتایج شناسایی</h3>
  <div id="results">هنوز چیزی شناسایی نشده است.</div>
</div>

<script>
const video = document.getElementById("video");
const statusText = document.getElementById("status");
const results = document.getElementById("results");
const objectSelect = document.getElementById("objectSelect");

let model = null;
let stream = null;
let running = false;
let cameraSide = "environment";
let lastBeep = 0;
let scanTimer = null;

const names = {
  "book":"کتاب",
  "cell phone":"گوشی موبایل",
  "bottle":"بطری",
  "cup":"لیوان",
  "laptop":"لپ‌تاپ",
  "mouse":"ماوس",
  "keyboard":"کیبورد",
  "chair":"صندلی",
  "backpack":"کوله‌پشتی",
  "clock":"ساعت",
  "remote":"کنترل",
  "banana":"موز",
  "apple":"سیب",
  "scissors":"قیچی",
  "person":"انسان",
  "car":"ماشین",
  "bicycle":"دوچرخه",
  "dog":"سگ",
  "cat":"گربه",
  "sports ball":"توپ",
  "tv":"تلویزیون",
  "potted plant":"گلدان",
  "handbag":"کیف دستی",
  "umbrella":"چتر"
};

function beep(){
  try{
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    const audio = new AudioContextClass();

    if(audio.state === "suspended"){
      audio.resume();
    }

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = 850;
    gain.gain.value = 0.15;

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.18);

    oscillator.onended = () => audio.close();
  }catch(error){
    console.log("Audio error:",error);
  }
}

async function loadModel(){
  if(model) return true;

  statusText.textContent = "در حال بارگذاری هوش مصنوعی...";

  try{
    await tf.ready();

    model = await cocoSsd.load({
      base: "lite_mobilenet_v2"
    });

    statusText.textContent = "هوش مصنوعی آماده است.";
    return true;

  }catch(error){
    statusText.textContent = "خطا در بارگذاری مدل.";
    console.error(error);
    return false;
  }
}

async function startCamera(){
  try{
    if(!await loadModel()) return;

    if(stream){
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:cameraSide,
        width:{ideal:640},
        height:{ideal:480}
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    statusText.textContent = "دوربین فعال است؛ در حال تشخیص...";

    clearTimeout(scanTimer);
    scan();

  }catch(error){
    statusText.textContent =
      "خطای دوربین؛ اجازه دسترسی دوربین را بررسی کن.";
    console.error(error);
  }
}

function stopCamera(){
  running = false;
  clearTimeout(scanTimer);

  if(stream){
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  statusText.textContent = "دوربین متوقف شد.";
}

async function scan(){
  if(!running || !model) return;

  if(video.readyState >= 2){
    try{
      const predictions = await model.detect(video);

      const selected = objectSelect.value;

      const detected = predictions.filter(item =>
        item.score >= 0.45 &&
        (selected === "all" || item.class === selected)
      );

      if(detected.length){
        results.innerHTML = "";

        detected.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";

          const title = document.createElement("strong");
          title.textContent =
            names[item.class] || item.class;

          const confidence = document.createElement("small");
          confidence.textContent =
            " — اطمینان: " +
            Math.round(item.score * 100) + "%";

          div.appendChild(title);
          div.appendChild(confidence);
          results.appendChild(div);
        });

        statusText.textContent =
          detected.length + " مورد شناسایی شد.";

        const now = Date.now();

        if(now - lastBeep > 1800){
          beep();
          lastBeep = now;
        }

      }else{
        results.textContent = "شیء انتخاب‌شده شناسایی نشد.";
        statusText.textContent = "در حال جست‌وجوی اشیا...";
      }

    }catch(error){
      console.error(error);
    }
  }

  if(running){
    scanTimer = setTimeout(scan,250);
  }
}

document.getElementById("startBtn").onclick = startCamera;

document.getElementById("stopBtn").onclick = stopCamera;

document.getElementById("switchBtn").onclick = async () => {
  cameraSide =
    cameraSide === "environment" ? "user" : "environment";

  if(running){
    await startCamera();
  }
};

document.getElementById("beepBtn").onclick = beep;

window.addEventListener("beforeunload",stopCamera);
</script>

</body>
</html>
