<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR VISION</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background: #07111c;
    color: #eafff7;
    font-family: Arial, sans-serif;
    text-align: center;
}
header {
    padding: 20px;
    background: #0d2433;
    border-bottom: 2px solid #00e5a0;
}
h1 {
    color: #00ffc3;
    letter-spacing: 3px;
    margin: 5px;
}
.status {
    color: #8affd5;
    margin-top: 10px;
}
.container {
    width: 95%;
    max-width: 850px;
    margin: 20px auto;
}
.screen {
    position: relative;
    width: 100%;
    background: #000;
    border: 2px solid #00e5a0;
    border-radius: 12px;
    overflow: hidden;
}
video, canvas {
    width: 100%;
    display: block;
}
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 18px 0;
}
button, select {
    padding: 12px 16px;
    border: 1px solid #00e5a0;
    border-radius: 8px;
    background: #123344;
    color: white;
    font-size: 15px;
}
button {
    cursor: pointer;
}
button:hover {
    background: #087b65;
}
.info {
    background: #102534;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}
#result {
    color: #00ffc3;
    font-size: 18px;
}
</style>
</head>

<body>

<header>
<h1>RADAR VISION</h1>
<div class="status" id="status">در انتظار راه‌اندازی...</div>
</header>

<div class="container">

<div class="screen">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button id="startBtn">شروع اسکن</button>
<button id="stopBtn">توقف</button>
<button id="soundBtn">تست صدا</button>
</div>

<div class="controls">
<select id="cameraMode">
<option value="environment">دوربین پشت</option>
<option value="user">دوربین جلو</option>
</select>

<select id="speed">
<option value="100">سرعت بالا</option>
<option value="200" selected>سرعت معمولی</option>
<option value="400">سرعت پایین</option>
</select>
</div>

<div class="info">
<div>وضعیت شناسایی:</div>
<div id="result">هنوز چیزی شناسایی نشده</div>
</div>

</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const resultText = document.getElementById("result");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const soundBtn = document.getElementById("soundBtn");

let model = null;
let cameraStream = null;
let running = false;
let scanning = false;
let timer = null;
let wasDetected = false;
let emptyFrames = 0;

const targets = ["book", "cell phone"];

function announce(message) {
    if (!("speechSynthesis" in window)) {
        statusText.textContent = "قابلیت پخش صدا پشتیبانی نمی‌شود";
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = "fa-IR";
    speech.rate = 1;

    const voices = window.speechSynthesis.getVoices();
    const persianVoice = voices.find(v =>
        v.lang.toLowerCase().startsWith("fa")
    );

    if (persianVoice) {
        speech.voice = persianVoice;
    }

    window.speechSynthesis.speak(speech);
}

soundBtn.addEventListener("click", () => {
    announce("سامانه رادار ویژن آماده است");
});

async function loadModel() {
    if (model) return;

    statusText.textContent = "در حال بارگذاری هوش مصنوعی...";

    model = await cocoSsd.load({
        base: "lite_mobilenet_v2"
    });

    statusText.textContent = "هوش مصنوعی آماده است";
}

async function startCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
    }

    const mode = document.getElementById("cameraMode").value;

    cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
            facingMode: { ideal: mode },
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    });

    video.srcObject = cameraStream;

    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });

    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

function drawPredictions(predictions) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    predictions.forEach(prediction => {
        if (!targets.includes(prediction.class)) return;
        if (prediction.score < 0.55) return;

        const [x, y, width, height] = prediction.bbox;

        ctx.strokeStyle = "#00ff9d";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, width, height);

        ctx.fillStyle = "#00ff9d";
        ctx.font = "bold 18px Arial";
        ctx.fillText(
            prediction.class + " " +
            Math.round(prediction.score * 100) + "%",
            x,
            Math.max(20, y - 8)
        );
    });
}
</script>
<script>
async function scan() {
    if (!running || scanning) return;

    scanning = true;

    try {
        if (video.readyState >= 2) {
            const predictions = await model.detect(video);

            drawPredictions(predictions);

            const found = predictions.filter(item =>
                targets.includes(item.class) &&
                item.score >= 0.55
            );

            if (found.length > 0) {
                const names = [...new Set(found.map(item => item.class))];

                resultText.textContent =
                    "شناسایی شد: " + names.join("، ");

                statusText.textContent = "شیء شناسایی شد";

                emptyFrames = 0;

                if (!wasDetected) {
                    announce("شیء شناسایی شد");
                }

                wasDetected = true;
            } else {
                emptyFrames++;

                resultText.textContent = "چیزی شناسایی نشده";

                if (emptyFrames >= 5) {
                    wasDetected = false;
                }
            }
        }
    } catch (error) {
        console.error(error);
        statusText.textContent = "خطا در اسکن";
    }

    scanning = false;

    if (running) {
        const delay = Number(
            document.getElementById("speed").value
        );

        timer = setTimeout(scan, delay);
    }
}

startBtn.addEventListener("click", async () => {
    try {
        startBtn.disabled = true;

        await loadModel();
        await startCamera();

        running = true;
        wasDetected = false;
        emptyFrames = 0;

        statusText.textContent = "سامانه در حال اسکن است";

        scan();

    } catch (error) {
        console.error(error);

        statusText.textContent =
            "خطا: دسترسی دوربین یا بارگذاری مدل ناموفق بود";

        running = false;
    } finally {
        startBtn.disabled = false;
    }
});

stopBtn.addEventListener("click", () => {
    running = false;

    clearTimeout(timer);

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    resultText.textContent = "اسکن متوقف شد";
    statusText.textContent = "سامانه متوقف است";
});

window.addEventListener("beforeunload", () => {
    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
    }
});
</script>

</body>
</html>
