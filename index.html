
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR VISION</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #07111c;
  color: #00eac0;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
}

h1 {
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.panel {
  max-width: 750px;
  margin: 15px auto;
  padding: 15px;
  background: #102333;
  border: 1px solid #00a98a;
  border-radius: 15px;
}

video {
  width: 100%;
  background: black;
  border-radius: 12px;
  margin-top: 12px;
}

button, select {
  padding: 12px;
  margin: 5px;
  border: 1px solid #00eac0;
  border-radius: 8px;
  background: #123a49;
  color: white;
  font-size: 14px;
}

button {
  cursor: pointer;
}

button:active {
  background: #087b69;
}

#status {
  padding: 12px;
  background: #071923;
  border-radius: 8px;
  color: white;
  margin: 12px 0;
}

#result {
  min-height: 75px;
  padding: 15px;
  background: #071923;
  border: 1px solid #176b60;
  border-radius: 10px;
  margin-top: 12px;
  color: #fff;
  line-height: 2;
}

.small {
  color: #91b9b5;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>RADAR VISION</h1>
<p class="small">AI OBJECT RECOGNITION</p>

<div class="panel">

  <div id="status">در حال بارگذاری مدل هوش مصنوعی...</div>

  <video id="video" autoplay playsinline muted></video>

  <div>
    <button id="startBtn">شروع دوربین</button>
    <button id="stopBtn">توقف دوربین</button>
    <button id="testBtn">تست بوق</button>
  </div>

  <hr>

  <p>انتخاب نوع شیء برای نمایش:</p>

  <select id="objectSelect">
    <option value="all">همه اشیای پشتیبانی‌شده</option>
    <option value="book">کتاب</option>
    <option value="cell phone">موبایل</option>
    <option value="bottle">بطری</option>
    <option value="cup">لیوان</option>
    <option value="chair">صندلی</option>
    <option value="laptop">لپ‌تاپ</option>
    <option value="mouse">ماوس</option>
    <option value="keyboard">کیبورد</option>
    <option value="backpack">کوله‌پشتی</option>
    <option value="umbrella">چتر</option>
    <option value="clock">ساعت</option>
    <option value="remote">کنترل</option>
    <option value="banana">موز</option>
    <option value="apple">سیب</option>
    <option value="sports ball">توپ</option>
    <option value="scissors">قیچی</option>
  </select>

  <br>

  <p>انتخاب دوربین:</p>

  <select id="cameraSelect">
    <option value="environment">دوربین عقب</option>
    <option value="user">دوربین جلو</option>
  </select>

  <p>سرعت بررسی تصویر:</p>

  <select id="speedSelect">
    <option value="700">آرام</option>
    <option value="400" selected>معمولی</option>
    <option value="250">سریع</option>
  </select>

  <div id="result">
    هنوز شیئی شناسایی نشده است.
  </div>

  <p class="small">
    این برنامه آموزشی است و فقط نام اشیای قابل‌شناسایی را نمایش می‌دهد.
  </p>

</div>

<script>
const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

let model = null;
let stream = null;
let running = false;
let audioContext = null;
let lastBeep = 0;
let previousDetected = false;

const names = {
  "book": "کتاب",
  "cell phone": "موبایل",
  "bottle": "بطری",
  "cup": "لیوان",
  "chair": "صندلی",
  "laptop": "لپ‌تاپ",
  "mouse": "ماوس",
  "keyboard": "کیبورد",
  "backpack": "کوله‌پشتی",
  "umbrella": "چتر",
  "clock": "ساعت",
  "remote": "کنترل",
  "banana": "موز",
  "apple": "سیب",
  "sports ball": "توپ",
  "scissors": "قیچی"
};

async function loadModel() {
  try {
    statusBox.textContent = "در حال آماده‌سازی هوش مصنوعی...";

    await tf.ready();

    model = await cocoSsd.load({
      base: "lite_mobilenet_v2"
    });

    statusBox.textContent = "مدل با موفقیت آماده شد.";
  } catch (error) {
    console.error(error);
    statusBox.textContent =
      "خطا در بارگذاری مدل. اتصال اینترنت را بررسی کن.";
  }
}

async function beep() {
  try {
    if (!audioContext) {
      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 950;

    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.18);

  } catch (error) {
    console.error("Audio error:", error);
  }
}

async function startCamera() {
  if (!model) {
    statusBox.textContent = "مدل هنوز آماده نشده است.";
    return;
  }

  if (running) return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {
          ideal: document.getElementById("cameraSelect").value
        }
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    previousDetected = false;

    statusBox.textContent = "دوربین روشن است؛ در حال بررسی...";
    scan();

  } catch (error) {
    console.error(error);
    statusBox.textContent =
      "دوربین باز نشد. مجوز دوربین را بررسی کن.";
  }
}

function stopCamera() {
  running = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;

  resultBox.textContent = "بررسی متوقف شد.";
  statusBox.textContent = "دوربین خاموش است.";
  previousDetected = false;
}

async function scan() {
  if (!running || !model) return;

  if (video.readyState >= 2) {
    try {
      const predictions = await model.detect(video);

      const selected =
        document.getElementById("objectSelect").value;

      const found = predictions.filter(item => {
        return item.score >= 0.55 &&
          (selected === "all" || item.class === selected);
      });

      if (found.length > 0) {
        const detectedNames = found.map(item => {
          const faName = names[item.class] || item.class;
          const confidence = Math.round(item.score * 100);

          return faName + " (" + confidence + "%)";
        });

        resultBox.textContent =
          "اشیای شناسایی‌شده: " +
          [...new Set(detectedNames)].join("، ");

        const now = Date.now();

        if (!previousDetected && now - lastBeep > 1200) {
          await beep();
          lastBeep = now;
        }

        previousDetected = true;

        statusBox.textContent = "شناسایی انجام شد.";

      } else {
        resultBox.textContent =
          "شیء انتخاب‌شده شناسایی نشد.";

        previousDetected = false;
        statusBox.textContent = "در حال بررسی تصویر...";
      }

    } catch (error) {
      console.error(error);
      statusBox.textContent = "خطا در بررسی تصویر.";
    }
  }

  if (running) {
    const delay = Number(
      document.getElementById("speedSelect").value
    );

    setTimeout(scan, delay);
  }
}

document.getElementById("startBtn")
  .addEventListener("click", startCamera);

document.getElementById("stopBtn")
  .addEventListener("click", stopCamera);

document.getElementById("testBtn")
  .addEventListener("click", beep);

document.getElementById("cameraSelect")
  .addEventListener("change", async () => {
    if (running) {
      stopCamera();
      await startCamera();
    }
  });

window.addEventListener("beforeunload", stopCamera);

loadModel();
</script>

</body>
</html>
